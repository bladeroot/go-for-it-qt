name: CI & Packaging

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-package:
    name: Build, Test & Package (.deb in Debian Trixie)
    runs-on: ubuntu-latest
    container:
      image: debian:trixie-slim
    steps:
      - name: Install Git & system dependencies
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git cmake ninja-build g++ dpkg-dev \
            qt6-base-dev qt6-declarative-dev qt6-multimedia-dev \
            libqt6sql6-sqlite qml6-module-qtquick \
            qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-dialogs qml6-module-qtquick-window

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure CMake
        run: |
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCPACK_DEBIAN_PACKAGE_SHLIBDEPS=ON \
            -DBUILD_TESTING=ON

      - name: Build & Run Tests
        run: |
          cmake --build build
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Build Packages (.deb & .tar.gz)
        run: |
          cd build && cpack -G "DEB;TGZ"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-for-it-packages
          path: |
            build/*.deb
            build/*.tar.gz

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            build/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
