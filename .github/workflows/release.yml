name: CI & Packaging

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Package (Qt 6.6)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build tools and libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ dpkg-dev \
            libgl1-mesa-dev libxkbcommon-dev libx11-xcb1 \
            libpulse-dev libasound2-dev libsqlite3-dev

      - name: Install Qt 6.6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build -GNinja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DBUILD_TESTING=ON

      - name: Build & Run Tests
        run: |
          cmake --build build
          QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure

      - name: Build Packages (.deb & .tar.gz)
        run: |
          cd build && cpack -G "DEB;TGZ"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-for-it-packages
          path: |
            build/*.deb
            build/*.tar.gz

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/*.deb
            build/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
